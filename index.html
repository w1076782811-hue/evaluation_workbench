<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="电商生图模型评测工作台，支持独立盲判、缺陷记录、PE 转写和维度报告的本地演示。">
  <title>评测工作台 · 电商生图</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231565C0'/%3E%3Cpath d='m8 17 5 5 11-12' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg aria-hidden="true" width="0" height="0" style="position:absolute"><defs>
    <symbol id="i-dashboard" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-task" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 10h6M9 14h6M9 18h4"/></symbol>
    <symbol id="i-review" viewBox="0 0 24 24"><path d="M3 12s3-7 9-7 9 7 9 7-3 7-9 7-9-7-9-7Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-pe" viewBox="0 0 24 24"><path d="m5 19 10-10 4 4L9 23M14 2v4M12 4h4M5 7v6M2 10h6M20 3v4M18 5h4"/></symbol>
    <symbol id="i-report" viewBox="0 0 24 24"><path d="M4 3v18h17M9 16v-5M14 16V6M19 16V9"/></symbol>
    <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="2"/><path d="m3 17 6-6 4 4 3-3 5 5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/><path d="M21 12v8H3V3h12"/></symbol>
  </defs></svg>
  <a class="skip-link" href="#main-content">跳到工作区</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="#/dashboard"><span class="brand-mark"><svg class="nav-icon" aria-hidden="true"><use href="#i-check"/></svg></span><span><span class="brand-title">评测工作台</span><span class="brand-subtitle">E-COMMERCE EVAL</span></span></a>
      <nav aria-label="工作区导航">
        <div class="nav-group" aria-labelledby="evaluation-nav-title">
          <div class="sidebar-section-label" id="evaluation-nav-title">评测工作台</div>
          <div class="nav-group-links">
            <a class="nav-link" href="#/dashboard" data-route="dashboard"><svg class="nav-icon" aria-hidden="true"><use href="#i-dashboard"/></svg>工作台首页</a>
            <a class="nav-link" href="#/setup" data-route="setup"><svg class="nav-icon" aria-hidden="true"><use href="#i-check"/></svg>评测准备</a>
            <a class="nav-link" href="#/task" data-route="task"><svg class="nav-icon" aria-hidden="true"><use href="#i-task"/></svg>评测任务<span class="nav-badge" id="task-badge">3</span></a>
            <a class="nav-link" href="#/review" data-route="review"><svg class="nav-icon" aria-hidden="true"><use href="#i-review"/></svg>评分复核<span class="nav-badge" id="review-badge">12</span></a>
            <a class="nav-link" href="#/calibration" data-route="calibration"><svg class="nav-icon" aria-hidden="true"><use href="#i-check"/></svg>分歧裁决</a>
            <a class="nav-link" href="#/report" data-route="report"><svg class="nav-icon" aria-hidden="true"><use href="#i-report"/></svg>评测报告</a>
            <a class="nav-link" href="#/cases" data-route="cases"><svg class="nav-icon" aria-hidden="true"><use href="#i-task"/></svg>案例与改进</a>
          </div>
        </div>
        <div class="nav-group production-nav" aria-labelledby="production-nav-title">
          <div class="sidebar-section-label" id="production-nav-title">生产提效</div>
          <div class="nav-group-links">
            <a class="nav-link" href="#/pe" data-route="pe"><svg class="nav-icon" aria-hidden="true"><use href="#i-pe"/></svg>PE 优化</a>
          </div>
        </div>
      </nav>
      <div class="sidebar-footer"><span class="pill blue">DEMO · 本地演示</span><p>数据保存在当前浏览器<br>机器评分为预置模拟结果</p><span class="muted">电商生图评测 / v1.1</span></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="breadcrumbs"><span id="workspace-area">电商生图</span><span>/</span><strong id="breadcrumb-title">工作台首页</strong></div><div class="topbar-actions"><span class="local-status"><span class="status-dot"></span>本地工作空间</span><button class="icon-button theme-toggle" id="theme-toggle" aria-label="切换深色模式" title="切换深色模式"><svg class="nav-icon" aria-hidden="true"><use href="#i-theme"/></svg></button><span class="avatar" title="本地演示评测员">评</span></div></header>
      <main class="main-content" id="main-content" tabindex="-1">
        <div id="storage-notice" class="notice" hidden></div>
        <section id="page-dashboard" data-page="dashboard" aria-label="工作台首页"></section>
        <section id="page-setup" data-page="setup" aria-label="评测准备" hidden></section>
        <section id="page-task" data-page="task" aria-label="评测任务" hidden></section>
        <section id="page-review" data-page="review" aria-label="评分复核" hidden></section>
        <section id="page-calibration" data-page="calibration" aria-label="分歧裁决" hidden></section>
        <section id="page-pe" data-page="pe" aria-label="PE 优化" hidden></section>
        <section id="page-report" data-page="report" aria-label="评测报告" hidden></section>
        <section id="page-cases" data-page="cases" aria-label="案例与改进" hidden></section>
        <input id="dataset-import" type="file" accept="application/json,.json" hidden aria-label="导入评测集 JSON">
        <input id="image-input" type="file" accept="image/*" hidden aria-label="选择本地评测图片">
        <noscript><div class="notice">请在浏览器中启用 JavaScript，以使用本地评测工作台。</div></noscript>
      </main>
    </div>
  </div>
  <dialog id="task-dialog"><div id="task-dialog-content"></div><form method="dialog"><button class="button secondary">关闭详情</button></form></dialog>
  <dialog id="image-dialog" class="image-dialog"><div id="image-dialog-content"></div><form method="dialog"><button class="button secondary">关闭图片</button></form></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.6.1/dist/chart.umd.min.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
